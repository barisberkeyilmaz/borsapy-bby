version: "3.8"

services:
  backend:
    build:
      context: ../apps/backend
      dockerfile: ../../docker/Dockerfile.backend.dev
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app:/borsapy-lib
    volumes:
      - ../apps/backend:/app
      - ../../:/borsapy-lib:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: ../../docker/Dockerfile.frontend.dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ../apps/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: pnpm dev

networks:
  default:
    name: borsapy-web-dev
